*{box-sizing:border-box}body{margin:0;background:#0c1018;color:#e8e5dc;font-family:system-ui,sans-serif}button{font:inherit;cursor:pointer}#game{display:block;width:100%;height:100dvh;touch-action:none}#hud{position:fixed;top:0;left:0;right:0;padding:15px 20px;display:none;pointer-events:none;text-shadow:0 2px 5px #000}#top{display:flex;justify-content:space-between;align-items:start;font-weight:700}#clock{font-size:26px;color:#f4ddaa;font-variant-numeric:tabular-nums}#stats{font-size:13px;line-height:1.8}.bar{width:185px;height:8px;background:#343644;border-radius:10px;overflow:hidden;margin:5px 0}.bar>i{display:block;height:100%;background:#db666d}.xp>i{background:#91d9b0}#items{position:fixed;bottom:15px;left:20px;font-size:12px;color:#dbd2b9;line-height:1.6;max-width:75%}#pause{pointer-events:auto;border:1px solid #817e76;background:#171d27;color:white;border-radius:8px;padding:7px 12px} .overlay{position:fixed;inset:0;background:rgba(8,12,19,.85);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}.panel{width:min(760px,100%);background:#171d25;border:1px solid #514b41;border-radius:18px;padding:30px;box-shadow:0 20px 80px #0009}.eyebrow{color:#d3af72;letter-spacing:.2em;font-size:11px;font-weight:800}h1{font-size:clamp(34px,6vw,60px);line-height:1.1;margin:14px 0}h2{margin:6px 0 14px;font-size:27px}.muted{color:#a8acb4;line-height:1.7;font-size:14px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.choice{border:1px solid #53514c;background:#232a32;color:#eee;text-align:left;border-radius:12px;padding:18px;min-height:135px;transition:.15s}.choice:hover,.choice:focus-visible{border-color:#e4bd78;background:#30363b;transform:translateY(-2px)}.choice strong{display:block;font-size:18px;color:#f0d29c;margin:7px 0}.choice small{color:#b6b8b7;line-height:1.5}.tag{font-size:11px;color:#91c9b3}.foot{font-size:12px;color:#868e99;line-height:1.7}#notice{position:fixed;top:110px;left:50%;transform:translateX(- const canvas=document.querySelector('#game'),c=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),hud=document.querySelector('#hud');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();

function drawSprite(id,x,y,w,h){let img=sprites[id];if(!img||!img.complete||!img.naturalWidth)return false;let scale=Math.min(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;c.drawImage(img,x-dw/2,y-dh/2,dw,dh);return true}
const upgrades=[{id:'power',name:'날카로운 힘',desc:'모든 공격 피해 +25%',icon:'◆',apply:()=>p.power*=1.25},{id:'speed',name:'신속한 손',desc:'공격 간격 15% 감소',icon:'»',apply:()=>p.cool*=.85},{id:'multi',name:'다중 공격',desc:'한 번에 발사하는 투사체 +1',icon:'✧',apply:()=>p.multi++},{id:'vital',name:'생명의 씨앗',desc:'최대 체력 +25, 체력 25 회복',icon:'♥',apply:()=>{p.maxhp+=25;p.hp=Math.min(p.maxhp,p.hp+25)}},{id:'move',name:'가벼운 발걸음',desc:'이동 속도 +12%',icon:'➜',apply:()=>p.speed*=1.12},{id:'magnet',name:'자석',desc:'경험치 획득 범위 +35%',icon:'◉',apply:()=>p.magnet*=1.35},{id:'fire',name:'불씨',desc:'공격이 화상을 부여해 지속 피해',icon:'♨',unique:true,apply:()=>p.items.fire=true},{id:'ash',name:'뜨거운 재',desc:'화상에 걸린 적 처치 시 주변에 폭발',icon:'✹',unique:true,apply:()=>p.items.ash=true},{id:'ring',name:'불길의 고리',desc:'화상 폭발이 주변 적에게 화상을 전파',icon:'◌',unique:true,apply:()=>p.items.ring=true},{id:'shock',name:'감전의 파편',desc:'공격이 감전을 쌓음',icon:'ϟ',unique:true,apply:()=>p.items.shock=true},{id:'chain',name:'전류 확산기',desc:'감전된 적을 공격하면 주변 적에게 번개',icon:'⌁',unique:true,apply:()=>p.items.chain=true},{id:'storm',name:'폭풍의 심장',desc:'감전 5회에 도달하면 주변에 폭발',icon:'✺',unique:true,apply:()=>p.items.storm=true},{id:'heal',name:'회복의 물약',desc:'체력 35 회복',icon:'✚',apply:()=>p.hp=Math.min(p.maxhp,p.hp+35)}];
function show(html){overlay.innerHTML=html;overlay.style.display='flex'}function startMenu(){state='menu';hud.style.display='none';show(`<div class="panel"><div class="eyebrow">SURVIVE · BUILD · REPEAT</div><h1>8분의 생존</h1><p class="muted">몰려오는 적을 피하고, 아이템을 조합해 강해지세요.<br>8분에 등장하는 최종 보스를 처치하면 클리어!</p><div class="choices">${Object.entries(weapons).map(([id,w])=>`<button class="choice" data-weapon="${id}"><img class="portrait" src="assets/${w.image}.png" alt=""><span class="tag">시작 무기 선택</span><strong>${w.icon} ${w.name}</strong><small>${w.desc}</small></button>`).join('')}</div><div class="foot">PC: WASD 또는 방향키 이동 · 모바일: 화면을 드래그해 이동<br>공격은 자동입니다. 아이템은 선택하는 즉시 적용됩니다.</div></div>`);overlay.querySelectorAll('[data-weapon]').forEach(b=>b.onclick=()=>start(b.dataset.weapon))}
function start(weapon){p={x:0,y:0,r:9,hp:100,maxhp:100,speed:160,power:1,cool:1,multi:1,magnet:145,lv:1,xp:0,need:7,weapon,items:{},inv:0,facing:1,moving:0,lookAngle:0,action:null};enemies=[];shots=[];gems=[];fx=[];hazards=[];clock=0;spawn=0;attack=0;boss4=boss8=false;kills=0;levelQueue=0;keys={};pointer=null;state='playing';overlay.style.display='none';hud.style.display='block';last=performance.now();announce('살아남으세요',2)}
function announce(s,t=2){document.querySelector('#notice').textContent=s;noticeT=t}function addEnemy(type){let a=rand(0,Math.PI*2),r=Math.hypot(W,H)/2+50,e={x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,type,hit:0,fire:0,shock:0,fireTick:0,shoot:rand(2,3),wind:0,pattern:0,phase:rand(0,Math.PI*2),facing:1};let scale=1+clock/380;let m=monsters.find(v=>v[0]===type);if(m){let role=m[3];Object.assign(e,{name:m[1],r:role==='tank'?18:role==='fast'?12:13,hp:(role==='tank'?58:role==='fast'?20:24)*scale,speed:role==='tank'?29:role==='fast'?72:39,color:'#a3c49a',dmg:role==='tank'?13:8})}if(type==='mini')Object.assign(e,{name:'듄켈',r:39,hp:650,speed:38,color:'#88be91',dmg:18});if(type==='boss')Object.assign(e,{name:'림보',r:46,hp:2400,speed:43,color:'#a76cba',dmg:22});e.maxhp=e.hp;enemies.push(e);return e}
function makeHazard(type,x,y,angle=0){hazards.push({type,x,y,angle,wait:type==='meteor'?1.1:1.25,life:0,hit:false})}
function bossPattern(e){let a=Math.atan2(p.y-e.y,p.x-e.x);if(e.type==='mini'){if(e.pattern++%2===0){for(let i=0;i<3;i++)makeHazard('meteor',p.x+rand(-100,100),p.y+rand(-100,100))}else makeHazard('slash',e.x,e.y,a)}else{if(e.pattern++%2===0)makeHazard('charge',e.x,e.y,a);else makeHazard('ring',e.x,e.y)} }
function updateHazards(dt){for(const h of hazards){if(h.wait>0){h.wait-=dt;if(h.wait<=0){h.life=.35;let dx=p.x-h.x,dy=p.y-h.y,d=Math.hypot(dx,dy),along=dx*Math.cos(h.angle)+dy*Math.sin(h.angle),across=Math.abs(-dx*Math.sin(h.angle)+dy*Math.cos(h.angle));let inside=h.type==='meteor'?d<48:h.type==='ring'?d>65&&d<180:h.type==='slash'?d<145&&along>0&&across<85:along>0&&along<360&&across<42;if(inside&&p.inv<=0){p.hp-=h.type==='meteor'?15:22;p.inv=.75}fx.push({type:'blast',x:h.x,y:h.y,r:h.type==='meteor'?48:70,life:.3,max:.3,color:h.type==='meteor'?'#ffaf6b':'#bb7bea'})}}else h.life-=dt}hazards=hazards.filter(h=>h.wait>0||h.life>0)}
function getNearest(){let best=null,d=1e9;for(const e of enemies){let x=dist(p,e);if(x<d){d=x;best=e}}return best}function fireWeapon(){let e=getNearest();if(!e)return;let a=p.weapon==='sword'&&p.action?.aim!==undefined?p.action.aim:Math.atan2(e.y-p.y,e.x-p.x);if(p.weapon==='sword'){fx.push({type:'swordArea',x:p.x,y:p.y,a,life:.22,max:.22});for(const target of [...enemies])if(!target.dead&&circleTouchesSword(target.x,target.y,target.r,p.x,p.y,a))hit(target,WEAPON_STATS.sword.damage*p.power)}else{for(let j=0;j<p.multi;j++){let angle=a+(j-(p.multi-1)/2)*.16;shots.push({x:p.x,y:p.y,vx:Math.cos(angle)*(p.weapon==='crossbow'?410:245),vy:Math.sin(angle)*(p.weapon==='crossbow'?410:245),life:1.8,r:p.weapon==='crossbow'?4:7,damage:WEAPON_STATS[p.weapon].damage*p.power,kind:p.weapon})}}}
function hit(e,d,secondary=false){if(e.dead)return;e.hp-=d;e.hit=.1;fx.push({type:'damage',x:e.x+rand(-6,6),y:e.y-e.r,life:.72,max:.72,value:Math.round(d*10)/10,secondary});if(!secondary){if(p.items.fire)e.fire=3;if(p.items.shock){e.shock++;if(p.items.chain){let other=enemies.find(o=>o!==e&&!o.dead&&dist(o,e)<115);if(other){fx.push({type:'line',x:e.x,y:e.y,x2:other.x,y2:other.y,life:.15,max:.15});hit(other,8*p.power,true)}}if(p.items.storm&&e.shock>=5){e.shock=0;blast(e.x,e.y,78,20*p.power,'#ffe078',false)}}}if(e.hp<=0)kill(e)}
function blast(x,y,r,damage,color,spread){fx.push({type:'blast',x,y,r,life:.3,max:.3,color});for(const e of [...enemies])if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r+e.r){if(spread)e.fire=3;hit(e,damage,true)}}function kill(e){if(e.dead)return;e.dead=true;kills++;if(e.type==='boss'){state='win';end(true);return}if(e.fire>0&&p.items.ash)blast(e.x,e.y,65,16*p.power,'#f6a359',!!p.items.ring);gems.push({x:e.x,y:e.y,value:e.type==='mini'?15:e.type==='tank'?3:1});if(e.type==='mini'){p.hp=Math.min(p.maxhp,p.hp+30);levelQueue++;announce('듄켈 격파 · 강화 선택!',3)}}
function choose(){if(state!=='playing'||levelQueue<=0)return;levelQueue--;state='choose';let pool=upgrades.filter(u=>(p.weapon!=='sword'||u.id!=='multi')&&(!u.unique||!p.items[u.id]));pool.sort(()=>Math.random()-.5);let choices=pool.slice(0,3);show(`<div class="panel"><div class="eyebrow">POWER UP</div><h2>강화를 선택하세요</h2><p class="muted">선택 즉시 적용돼요. 아이템 배치는 필요 없어요.</p><div class="choices">${choices.map((u,i)=>`<button class="choice" data-n="${i}"><span class="tag">${u.icon} ${u.unique?'조합 아이템':'능력 강화'}</span><strong>${u.name}</strong><small>${u.desc}</small></button>`).join('')}</div><p class="foot">감전: 파편 → 확산기 → 폭풍의 심장 &nbsp; · &nbsp; 화상: 불씨 → 뜨거운 재 → 불길의 고리</p></div>`);overlay.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{choices[+b.dataset.n].apply();state='playing';overlay.style.display='none';last=performance.now();if(levelQueue>0)choose()})}
function end(win){state=win?'win':'dead';show(`<div class="panel"><div class="eyebrow">${win?'SURVIVED':'GAME OVER'}</div><h1>${win?'생존 성공':'여정의 끝'}</h1><p class="muted">${win?'최종 보스를 쓰러뜨렸어요!':'다른 강화 조합으로 다시 도전해보세요.'}</p><p>생존 시간 ${fmt(clock)}　·　레벨 ${p.lv}　·　처치 ${kills}</p><div class="choices"><button class="choice" id="again"><strong>다시 도전하기 →</strong><small>무기를 다시 선택합니다</small></button></div></div>`);document.querySelector('#again').onclick=startMenu}function fmt(t){return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`}
function update(dt){clock+=dt;if(noticeT>0){noticeT-=dt;if(noticeT<=0)document.querySelector('#notice').textContent=''}if(clock>=TIMING.midBoss&&!boss4){boss4=true;addEnemy('mini');announce('친위대장 듄켈 등장!',3)}if(clock>=TIMING.finalBoss&&!boss8){boss8=true;addEnemy('boss');announce('림보 등장!',4)}let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(pointer){dx=pointer.dx;dy=pointer.dy}let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}p.x+=dx*p.speed*dt;p.y+=dy*p.speed*dt;resolveTerrain(p);p.moving=len>0?1:0;if(len&&!p.action)p.lookAngle=Math.atan2(dx,dy);if(dx&&!p.action)p.facing=dx<0?-1:1;p.inv=Math.max(0,p.inv-dt);spawn-=dt;if(spawn<=0&&enemies.length<210){let count=1+Math.floor(clock/160);for(let i=0;i<count;i++){let tier=Math.min(3,Math.floor(clock/120));let group=monsters.filter(m=>m[2]===tier);addEnemy(group[Math.floor(Math.random()*group.length)][0])}spawn=Math.max(.18,.85-clock/950)}attack-=dt;
if(p.action){p.action.remaining-=dt;if(p.action.remaining<=0){if(p.action.stage==='windup'){fireWeapon();p.action.stage='follow';p.action.remaining=p.action.follow}else p.action=null}}
if(attack<=0&&!p.action){let target=getNearest();if(target){p.facing=target.x<p.x?-1:1;p.lookAngle=Math.atan2(target.x-p.x,target.y-p.y);let windup=p.weapon==='crossbow'?.18:p.weapon==='sword'?.22:.16;let follow=p.weapon==='sword'?.28:.20;p.action={stage:'windup',windup,follow,remaining:windup,aim:Math.atan2(target.y-p.y,target.x-p.x)};attack=WEAPON_STATS[p.weapon].interval*p.cool}}
for(const e of enemies){if(e.dead)continue;e.hit=Math.max(0,e.hit-dt);if(e.fire>0){e.fire-=dt;e.fireTick-=dt;if(e.fireTick<=0){e.fireTick=.5;hit(e,4*p.power,true)}}if(e.dead)continue;let d=dist(p,e),a=Math.atan2(p.y-e.y,p.x-e.x),speed=e.speed;a=steerEnemy(e,a);if(e.type==='mage'&&d<220)speed=d<140?-22:0;e.x+=Math.cos(a)*speed*dt;e.y+=Math.sin(a)*speed*dt;resolveTerrain(e);if(Math.abs(p.x-e.x)>1)e.facing=p.x<e.x?-1:1;if(e.type==='mage'){e.shoot-=dt;if(e.shoot<=0&&d<430){shots.push({x:e.x,y:e.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,life:3,r:6,kind:'enemy',damage:8});e.shoot=2.6}}if(e.type==='mini'||e.type==='boss'){e.shoot-=dt;if(e.shoot<=0){bossPattern(e);e.shoot=e.type==='boss'?3.8:4.8}}if(d<e.r+p.r&&p.inv<=0){p.hp-=e.dmg;p.inv=.65}if(p.hp<=0){end(false);return}}

function render(){c.fillStyle='#131d1d';c.fillRect(0,0,W,H);if(!p)return;c.save();c.translate(W/2-p.x,H/2-p.y);drawGround();drawTerrain();for(const h of hazards){c.save();c.translate(h.x,h.y);c.rotate(h.angle);c.strokeStyle=h.type==='meteor'?'#ffb36a':'#da8bff';c.fillStyle=h.type==='meteor'?'#ff924d55':'#b36dff55';c.lineWidth=3;if(h.type==='meteor'){c.beginPath();c.arc(0,0,48,0,Math.PI*2);c.fill();c.stroke()}else if(h.type==='ring'){c.beginPath();c.arc(0,0,180,0,Math.PI*2);c.arc(0,0,65,0,Math.PI*2,true);c.fill('evenodd');c.stroke()}else if(h.type==='charge'){c.fillRect(0,-42,360,84);c.strokeRect(0,-42,360,84)}else{c.beginPath();c.moveTo(0,0);c.arc(0,0,145,-.65,.65);c.closePath();c.fill();c.stroke()}c.restore()}for(const g of gems){c.fillStyle='#91e7bd';c.save();c.translate(g.x,g.y);c.rotate(Math.PI/4);c.fillRect(-4,-4,8,8);c.restore()}for(const e of enemies){if(e.wind>0){c.beginPath();c.arc(e.x,e.y,110,0,7);c.fillStyle='#ee74742e';c.fill();c.strokeStyle='#ff8b88aa';c.stroke()}drawMonster(e);c.save();c.strokeStyle='rgba(255,230,220,.55)';c.lineWidth=1;c.beginPath();c.arc(e.x,e.y,e.r,0,Math.PI*2);c.stroke();c.restore();if(e.fire>0){c.beginPath();c.arc(e.x,e.y,e.r+2,0,7)}if(e.fire>0){c.strokeStyle='#ffad64';c.lineWidth=3;c.stroke()}if(e.shock>0){c.fillStyle='#ffe87e';c.font='12px sans-serif';c.fillText('ϟ'+e.shock,e.x-7,e.y-e.r-9)}drawEnemyHealth(e)}for(const s of shots)drawProjectile(s);for(const f of fx){c.globalAlpha=Math.max(0,f.life/f.max);if(f.type==='swordArea')drawSwordArea(f);if(f.type==='arc'){c.strokeStyle='#f4e0a0';c.lineWidth=9;c.beginPath();c.arc(f.x,f.y,70,f.a-.7,f.a+.7);c.stroke()}if(f.type==='line'){c.strokeStyle='#ffe77f';c.lineWidth=3;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x2,f.y2);c.stroke()}if(f.type==='blast'){c.fillStyle=f.color;c.beginPath();c.arc(f.x,f.y,f.r*(1-f.life/f.max*.4),0,7);c.fill()}if(f.type==='damage'){let rise=(1-f.life/f.max)*24;c.font='bold 14px system-ui';c.textAlign='center';c.lineWidth=3;c.strokeStyle='#2b1e16';c.strokeText function frame(now){let dt=Math.min((now-last)/1000,.05);last=now;if(state==='playing')update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='escape')togglePause()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('blur',()=>{keys={};pointer=null;if(state==='playing')togglePause()});function togglePause(){if(state==='playing'){state='paused';show('<div class="panel"><h2>일시정지</h2><p class="muted">잠시 쉬어가세요.</p><div class="choices"><button class="choice" id="resume"><strong>계속하기 →</strong></button><button class="choice" id="menu"><strong>처음으로</strong></button></div></div>');document.querySelector('#resume').onclick=togglePause;document.querySelector('#menu').onclick=startMenu}else if(state==='paused'){state='playing';overlay.style.display='none';last=performance.now()}}document.querySelector('#pause').onclick=togglePause;canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y,l=Math.hypot(dx,dy);pointer.dx=dx/Math.max(35,l);pointer.dy=dy/Math.max(35,l);document.querySelector('#stick').style.transform=`translate(${pointer.dx*30}px,${pointer.dy*30}px)`});function release(e){if(pointer&&e.pointerId===pointer.id){pointer=null;document.querySelector('#stick').style.transform=''}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);startMenu();
