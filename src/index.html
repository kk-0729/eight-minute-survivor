<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>8분의 생존</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1018;color:#e8e5dc;font-family:system-ui,sans-serif}button{font:inherit;cursor:pointer}#game{display:block;width:100%;height:100dvh;touch-action:none}#hud{position:fixed;top:0;left:0;right:0;padding:15px 20px;display:none;pointer-events:none;text-shadow:0 2px 5px #000}#top{display:flex;justify-content:space-between;align-items:start;font-weight:700}#clock{font-size:26px;color:#f4ddaa;font-variant-numeric:tabular-nums}#stats{font-size:13px;line-height:1.8}.bar{width:185px;height:8px;background:#343644;border-radius:10px;overflow:hidden;margin:5px 0}.bar>i{display:block;height:100%;background:#db666d}.xp>i{background:#91d9b0}#items{position:fixed;bottom:15px;left:20px;font-size:12px;color:#dbd2b9;line-height:1.6;max-width:75%}#pause{pointer-events:auto;border:1px solid #817e76;background:#171d27;color:white;border-radius:8px;padding:7px 12px} .overlay{position:fixed;inset:0;background:rgba(8,12,19,.85);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}.panel{margin:auto;width:min(760px,100%);background:#171d25;border:1px solid #514b41;border-radius:18px;padding:30px;box-shadow:0 20px 80px #0009}.eyebrow{color:#d3af72;letter-spacing:.2em;font-size:11px;font-weight:800}h1{font-size:clamp(34px,6vw,60px);line-height:1.1;margin:14px 0}h2{margin:6px 0 14px;font-size:27px}.muted{color:#a8acb4;line-height:1.7;font-size:14px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0}.choices:has([data-weapon]),.choices:has([data-element]){grid-template-columns:repeat(3,minmax(0,1fr))}.choices:has([data-n]):not(:has([data-n="3"])){grid-template-columns:repeat(2,minmax(0,1fr))}.choice{border:1px solid #53514c;background:#232a32;color:#eee;text-align:left;border-radius:12px;padding:18px;min-height:135px;transition:.15s}.choice:hover,.choice:focus-visible{border-color:#e4bd78;background:#30363b;transform:translateY(-2px)}.choice strong{display:block;font-size:18px;color:#f0d29c;margin:7px 0}.choice small{color:#b6b8b7;line-height:1.5}.tag{font-size:11px;color:#91c9b3}.foot{font-size:12px;color:#868e99;line-height:1.7}#notice{position:fixed;top:110px;left:50%;transform:translateX(-50%);color:#ffdc9f;font-weight:bold;text-shadow:0 2px 6px #000;pointer-events:none;white-space:nowrap}#joystick{display:none;position:fixed;bottom:35px;right:35px;width:110px;height:110px;border:1px solid #ffffff55;border-radius:100%;background:#ffffff10;pointer-events:none}#stick{position:absolute;width:40px;height:40px;left:35px;top:35px;border-radius:50%;background:#ffffff55}@media(max-width:600px){.panel{padding:22px}.choices,.choices:has([data-weapon]),.choices:has([data-element]){grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:14px 0}.choice{min-height:112px;padding:12px}.choice strong{font-size:16px;margin:2px 0}.bar{width:125px}#items{max-width:65%}#joystick{display:block}}
.portrait{width:100%;height:125px;object-fit:contain;display:block;margin-bottom:8px}.choice:has(.portrait){min-height:230px} @media(max-width:600px){.portrait{height:60px}.choice:has(.portrait){min-height:0}}
.portrait{background-image:url('assets/characters/adventurers.png');background-size:300% 100%;background-repeat:no-repeat;image-rendering:pixelated}.character-sword{background-image:url('assets/characters/ren-reference.png');background-size:auto 85%;background-position:center center}.character-crossbow{background-position:50% center}.character-staff{background-position:100% center}
 .reroll{border:1px solid #9a825e;background:#242c34;color:#f6d9a8;border-radius:9px;padding:9px 15px} .reroll:hover{background:#303a43} .choice strong{overflow-wrap:anywhere} .choice small{display:block} @media(max-width:380px){.choices{gap:6px}.choice{padding:9px}.choice strong{font-size:14px}} </style></head><body><canvas id="game"></canvas><div id="hud"><div id="top"><div id="stats"><div id="hptext"></div><div class="bar"><i id="hpbar"></i></div><div id="lvtext"></div><div class="bar xp"><i id="xpbar"></i></div></div><div id="clock">00:00</div><button id="pause">일시정지</button></div><div id="items"></div></div><div id="notice"></div><div id="joystick"><div id="stick"></div></div><div id="overlay" class="overlay"></div><script src="visuals.js"></script><script src="hero2d.js"></script><script src="terrain.js"></script><script src="sword-combat.js"></script><script src="combat.js"></script><script src="build-skills.js"></script><script src="game.js"></script></body></html>
